<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Med Lab</title>
    <link rel="stylesheet" href="./style2.css">
</head>
<body>
    <div id="card"></div>
<form  action=""  id="pacienteCadastro">
    <h1>Med Lab</h1>
    <script src="./script2.js"></script>
    
    <div class="nome">
        <label for="nomeId">Nome</label>
        <input type="text" id="nome" name="Nome">
    </div>
    <div class="numeroSUS">
        <label for="numeroSUSId">Número SUS</label>
        <input type="number" id="numeroSUS" name="Número SUS">
    </div>
    <div class="dataNascimento">
        <label for="dataNascimentoId">Data Nascimento</label>
        <input type="date" id="dataNascimento" name="Data Nascimento">
    </div>
    <div class="telefone">
        <label for="telefoneId">Telefone</label>
        <input type="number" id="telefone" name="Telefone">
    </div>
    <button type="submit">Ver Paciente</button>
</form>
    

</body>
</html>
